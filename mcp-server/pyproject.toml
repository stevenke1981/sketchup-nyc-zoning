[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyczone-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3",
    "pydantic>=2.7",
    "nyczone",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
nyczone-mcp = "nyczone_mcp.server:main"
